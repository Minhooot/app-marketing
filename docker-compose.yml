services:
  phone001:
    image: redroid/redroid:12.0.0_64only-latest
    privileged: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./data/phone001:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_gpu_mode=guest
  phone002:
    image: redroid/redroid:12.0.0_64only-latest
